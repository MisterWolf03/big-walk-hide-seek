name: Adjust v1.3 overtime reveal size

on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/v13-overtime-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch overtime reveal size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const OVERTIME_REVEAL_RADIUS=200;'
          if s.count(old)!=1:
              raise SystemExit(f'expected one radius constant, found {s.count(old)}')
          s=s.replace(old,'const OVERTIME_REVEAL_RADIUS=100;',1)
          old_text="Relocation overtime — the hider's last-known 200-unit area is revealed in red for 2 minutes."
          new_text="Relocation overtime — the hider's last-known 200-unit-diameter area is revealed in red for 2 minutes."
          if s.count(old_text)!=1:
              raise SystemExit(f'expected one overtime message, found {s.count(old_text)}')
          s=s.replace(old_text,new_text,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'const OVERTIME_REVEAL_RADIUS=100;' in s
          assert '200-unit-diameter area' in s
          assert 'src="big-walk-map.png"' in s
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check

      - name: Commit source
        run: |
          rm .github/workflows/v13-overtime-size.yml
          git add index.html .github/workflows/v13-overtime-size.yml
          git commit -m "Shrink v1.3 overtime reveal to 200-unit diameter"
          git push origin v1.3.0-hider
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish preview
        run: |
          git checkout main
          git pull --ff-only origin main
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"')!=1:
              raise SystemExit('unexpected preview map path count')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1)
          p.write_text(s,encoding='utf-8')
          assert 'const OVERTIME_REVEAL_RADIUS=100;' in s
          assert '200-unit-diameter area' in s
          PY
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Shrink v1.3 overtime preview reveal"
          git push origin main
