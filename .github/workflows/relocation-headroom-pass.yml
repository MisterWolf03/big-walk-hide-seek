name: Relocation headroom pass
on:
  push:
    branches: [v1.2.0-rooms]
    paths: [.github/workflows/relocation-headroom-pass.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.0-rooms
          fetch-depth: 0
      - name: Add relocation boundary headroom
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path):
              p=Path(path); s=p.read_text()
              old='''  let target=relocationSettings.minDistance;\n  if(maxDistance<target)target=Math.max(25,Math.floor((maxDistance*.8)/25)*25);\n  return {index:relocationState.index,start,step,seen,maxDistance,target,skip:false,signaled:false};\n'''
              new='''  const headroomTarget=Math.max(25,Math.floor((maxDistance*.8)/25)*25);\n  const target=Math.min(relocationSettings.minDistance,headroomTarget);\n  return {index:relocationState.index,start,step,seen,maxDistance,target,skip:false,signaled:false};\n'''
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: relocation target block match count {s.count(old)}')
              s=s.replace(old,new,1)
              old_text="The hider must end at least the target displacement from where relocation began. If the connected legal search area is too small, the hider's browser scales the target to 80% of the available displacement; extremely cramped areas skip relocation."
              new_text="The hider must end at least the target displacement from where relocation began. To avoid forcing edge-of-zone hiding, the target is capped at roughly 80% of the maximum displacement available in the connected legal search area; extremely cramped areas skip relocation."
              if old_text in s:
                  s=s.replace(old_text,new_text,1)
              p.write_text(s)

          patch('index.html')
          PY
      - name: Validate source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
          git diff --check
      - name: Commit source change
        run: |
          rm .github/workflows/relocation-headroom-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/relocation-headroom-pass.yml
          git commit -m 'Add relocation boundary headroom'
          git push origin HEAD:v1.2.0-rooms
      - name: Patch isolated Rooms preview
        run: |
          git checkout -B main origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('rooms-preview/index.html'); s=p.read_text()
          old='''  let target=relocationSettings.minDistance;\n  if(maxDistance<target)target=Math.max(25,Math.floor((maxDistance*.8)/25)*25);\n  return {index:relocationState.index,start,step,seen,maxDistance,target,skip:false,signaled:false};\n'''
          new='''  const headroomTarget=Math.max(25,Math.floor((maxDistance*.8)/25)*25);\n  const target=Math.min(relocationSettings.minDistance,headroomTarget);\n  return {index:relocationState.index,start,step,seen,maxDistance,target,skip:false,signaled:false};\n'''
          if s.count(old)!=1:
              raise SystemExit(f'preview relocation target block match count {s.count(old)}')
          s=s.replace(old,new,1)
          old_text="The hider must end at least the target displacement from where relocation began. If the connected legal search area is too small, the hider's browser scales the target to 80% of the available displacement; extremely cramped areas skip relocation."
          new_text="The hider must end at least the target displacement from where relocation began. To avoid forcing edge-of-zone hiding, the target is capped at roughly 80% of the maximum displacement available in the connected legal search area; extremely cramped areas skip relocation."
          if old_text in s:
              s=s.replace(old_text,new_text,1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('rooms-preview/index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('No preview inline script found')
          Path('/tmp/preview-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/preview-inline.js
          grep -q 'src="../big-walk-map.png"' rooms-preview/index.html
          git diff --check
          git add rooms-preview/index.html
          git commit -m 'Add relocation headroom to Rooms preview'
          git push origin HEAD:main
