name: v1.3 mission reset cue pass
on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/run-v13-mission-reset-cues.yml'
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply mission reset and cue patch
        run: python3 .github/scripts/apply-v13-mission-reset-cues.py
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'missionAvailable:{kind:"mission",title:"Mission available"' in s
          assert 'title:"Mission accepted"' in s
          assert 'missionAvailable:roomModeConnected()&&!!missionState.available' in s
          assert 'now.running&&!prev.missionAvailable&&now.missionAvailable' in s
          assert 'missionStartRequestPending=false;missionSchedulerError="";resetLocalHiderMissionPlan();' in s
          assert s.count('missionState={active:false,available:false,index:0,nextAt:missionSettings.firstAt') >= 2
          start=s.index('<script>')+len('<script>');end=s.index('</script>',start)
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check
      - name: Commit source
        run: |
          git add index.html
          git commit -m "Reset missions cleanly and add Hider mission cues"
          git push origin v1.3.0-hider
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish isolated preview
        run: |
          git checkout main
          git pull --ff-only origin main
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"')!=1: raise SystemExit('unexpected preview map path count')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1)
          p.write_text(s,encoding='utf-8')
          start=s.index('<script>')+len('<script>');end=s.index('</script>',start)
          Path('/tmp/preview.js').write_text(s[start:end],encoding='utf-8')
          assert 'src="../big-walk-map.png"' in s
          assert 'Mission available' in s
          assert 'Mission accepted' in s
          PY
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Publish mission reset cues v1.3 preview"
          git push origin main
