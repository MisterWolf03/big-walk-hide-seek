name: Apply rooms index integration

on:
  push:
    branches: [v1.2.0-rooms-build]
    paths:
      - '.github/workflows/apply-rooms-index.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python patch_rooms.py
          node --check rooms.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          inline=[b for b in blocks if b.strip()]
          if not inline: raise SystemExit('No inline app script found')
          Path('/tmp/bigwalk-inline.js').write_text(inline[0])
          required=['view-room','roomPlayerName','createRoomBtn','joinRoomBtn','roomMemberList','firebase-config.js','rooms.js']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit(f'Missing room integration: {missing}')
          PY
          node --check /tmp/bigwalk-inline.js
          git diff --check
      - name: Commit integrated rooms preview
        run: |
          rm patch_rooms.py
          rm .github/workflows/apply-rooms-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html patch_rooms.py .github/workflows/apply-rooms-index.yml
          git commit -m 'Integrate rooms preview into map UI'
          git push origin v1.2.0-rooms-build
