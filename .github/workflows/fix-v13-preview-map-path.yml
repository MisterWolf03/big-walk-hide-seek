name: Fix v1.3 preview map path
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v13-preview-map-path.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix preview map path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"') != 1:
              raise SystemExit(f'expected one source map path, found {s.count("src=\"big-walk-map.png\"")}')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1)
          p.write_text(s,encoding='utf-8')
          start=s.index('<script>')+len('<script>'); end=s.index('</script>',start)
          Path('/tmp/preview.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1.3-preview/index.html
          git commit -m "Fix v1.3 preview map asset path"
          git push origin main
