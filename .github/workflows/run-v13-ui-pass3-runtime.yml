name: Run v1.3 UI runtime polish

on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/run-v13-ui-pass3-runtime.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply runtime polish
        run: python3 .github/scripts/fix-v13-ui-pass3-runtime.py
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'function updateRuleTimes(){}',
            'id="relocationSettingsGroup"',
            'relocationSettingsGroup.style.display=!connected||isHider?"":"none"',
            'next.textContent=isHider?"Forced relocation · paused":"Mission in progress"',
            'toast.style.display="";toast.className=meta.kind',
          ]
          for c in checks: assert c in s,c
          start=s.index('<script>')+len('<script>');end=s.index('</script>',start)
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check
      - name: Commit source
        run: |
          git add index.html
          git commit -m "Polish v1.3 gameplay clarity runtime"
          git push origin v1.3.0-hider
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish preview
        run: |
          git reset --hard HEAD
          git checkout main
          git pull --ff-only origin main
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html');s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"')!=1: raise SystemExit('unexpected preview map path count')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1);p.write_text(s,encoding='utf-8')
          start=s.index('<script>')+len('<script>');end=s.index('</script>',start)
          Path('/tmp/preview.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Publish v1.3 gameplay clarity runtime"
          git push origin main
