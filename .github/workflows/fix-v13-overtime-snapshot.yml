name: Fix v1.3 overtime snapshot

# rerun after reset-guard correction
on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/fix-v13-overtime-snapshot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply snapshot fix
        run: python3 .github/scripts/fix_v13_overtime_snapshot.py

      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          for check in [
              'overtimeToken:makeRelocationOvertimeToken()',
              'localRelocationOvertimeSnapshot',
              'waiting for the Hider snapshot',
              'String(signal.token||"")!==token',
              'src="big-walk-map.png"',
          ]:
              assert check in s, check
          r=Path('rooms.js').read_text(encoding='utf-8')
          assert 'relocationOvertimeToken' in r
          assert 'signalRelocationOvertime(index,x,y,token="")' in r
          PY
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check

      - name: Commit source fix
        run: |
          rm .github/workflows/fix-v13-overtime-snapshot.yml
          rm .github/scripts/fix_v13_overtime_snapshot.py
          git add index.html rooms.js .github/workflows/fix-v13-overtime-snapshot.yml .github/scripts/fix_v13_overtime_snapshot.py
          git commit -m "Fix v1.3 overtime snapshot delivery"
          git push origin v1.3.0-hider
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish updated v1.3 preview
        run: |
          git checkout main
          git pull --ff-only origin main
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"')!=1:
              raise SystemExit('unexpected preview map path count')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('v1.3-preview/index.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/preview.js').write_text(s[start:end],encoding='utf-8')
          assert 'src="../big-walk-map.png"' in s
          assert 'overtimeToken:makeRelocationOvertimeToken()' in s
          PY
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Update v1.3 overtime snapshot preview"
          git push origin main
