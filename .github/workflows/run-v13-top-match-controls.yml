name: v1.3 top match controls pass
on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/run-v13-top-match-controls.yml'
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply UI patch
        run: python3 .github/scripts/apply-v13-top-match-controls.py
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="topMatchControls"' in s
          assert 'id="matchControlSection"' not in s
          assert 'hidingEnded:{kind:"match",title:"Hiding time ended"' in s
          assert 'prev.hidingActive&&!now.hidingActive&&now.running' in s
          assert 'reset.style.display=paused?"grid":"none"' in s
          assert 'start.style.display="none";pause.style.display="grid"' in s
          assert s.count('id="startMatchBtn"') == 1
          assert s.count('id="pauseMatchBtn"') == 1
          assert s.count('id="resetMatchBtn"') == 1
          start=s.index('<script>')+len('<script>');end=s.index('</script>',start)
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check
      - name: Commit source
        run: |
          git add index.html
          git commit -m "Iconize match controls and add hiding-end cue"
          git push origin v1.3.0-hider
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish isolated preview
        run: |
          git checkout main
          git pull --ff-only origin main
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"')!=1: raise SystemExit('unexpected preview map path count')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1)
          p.write_text(s,encoding='utf-8')
          assert 'src="../big-walk-map.png"' in s
          assert 'id="topMatchControls"' in s
          assert 'Hiding time ended' in s
          start=s.index('<script>')+len('<script>');end=s.index('</script>',start)
          Path('/tmp/preview.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Publish top match controls v1.3 preview"
          git push origin main
