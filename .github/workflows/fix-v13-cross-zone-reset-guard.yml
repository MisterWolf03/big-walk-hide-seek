name: Fix v1.3 Cross Zone reset guard

on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/fix-v13-cross-zone-reset-guard.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v13-cross-zone-mission.yml')
          s=p.read_text(encoding='utf-8')
          old='''          once(\n              '  relocationState={active:false,index:0,nextAt:relocationSettings.firstAt,startedAt:null,deadline:null,lastResult:""};resetLocalRelocationPlan();localRelocationOvertimeSnapshot=null;localRelocationOvertimeSignalIndex=0;\\n',\n              '  relocationState={active:false,index:0,nextAt:relocationSettings.firstAt,startedAt:null,deadline:null,lastResult:""};resetLocalRelocationPlan();localRelocationOvertimeSnapshot=null;localRelocationOvertimeSignalIndex=0;\\n'\n              '  missionState={active:false,index:0,nextAt:missionSettings.firstAt,type:"crossZone",startedAt:null,lastResult:"",token:""};hiderPowerCharges=0;resetLocalHiderMissionPlan();\\n',\n              'local reset mission state')'''
          new='''          reset_fn_anchor=''' + "'''" + '''function resetMatchState(){\\n  matchRunning=false;matchElapsedMs=0;matchLastTick=null;\\n  questionCooldownUntil=0;seekerPointsSpent=0;\\n  relocationState={active:false,index:0,nextAt:relocationSettings.firstAt,startedAt:null,deadline:null,lastResult:\"\"};resetLocalRelocationPlan();localRelocationOvertimeSnapshot=null;localRelocationOvertimeSignalIndex=0;\\n''' + "'''" + '''\n          reset_fn_new=reset_fn_anchor+\'  missionState={active:false,index:0,nextAt:missionSettings.firstAt,type:\"crossZone\",startedAt:null,lastResult:\"\",token:\"\"};hiderPowerCharges=0;resetLocalHiderMissionPlan();\\n\'\n          once(reset_fn_anchor,reset_fn_new,\'local reset mission state\')'''
          if s.count(old)!=1:
              raise SystemExit(f'expected one old reset guard block, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/fix-v13-cross-zone-reset-guard.yml
          git add .github/workflows/v13-cross-zone-mission.yml .github/workflows/fix-v13-cross-zone-reset-guard.yml
          git commit -m "Fix Cross the Zone reset patch guard"
          git push origin v1.3.0-hider
