name: Apply v1.1.1 map display toggles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1.1.1-map-toggles.yml'

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply v1.1.1 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          replacements = [
              ('Big Walk Hide + Seek — Prototype 1.1.0', 'Big Walk Hide + Seek — Prototype 1.1.1'),
              ('const APP_VERSION="1.1.0";', 'const APP_VERSION="1.1.1";'),
              ('let showGrid=true, showTowers=true, showCalibration=false, showTowerRegions=false;',
               'let showGrid=true, showTowers=true, showLandmarks=true, showCalibration=false, showTowerRegions=false;'),
              ('''        <div class="row" style="margin-top:8px">\n          <button id="towerBtn">Hide towers</button>\n          <button id="calBtn">Calibration debug</button>\n        </div>''',
               '''        <div class="row" style="margin-top:8px">\n          <button id="towerBtn">Hide towers</button>\n          <button id="landmarkBtn">Hide landmarks</button>\n        </div>\n        <button id="calBtn" style="margin-top:8px">Calibration debug</button>'''),
              ('''  if(showTowers)drawTowers();\n  drawLandmarks();''',
               '''  if(showTowers)drawTowers();\n  if(showLandmarks)drawLandmarks();'''),
              ('''document.getElementById("towerBtn").onclick=()=>{\n  showTowers=!showTowers;document.getElementById("towerBtn").textContent=showTowers?"Hide towers":"Show towers";draw();\n};\ndocument.getElementById("calBtn").onclick=()=>{showCalibration=!showCalibration;draw();};''',
               '''document.getElementById("towerBtn").onclick=()=>{\n  showTowers=!showTowers;document.getElementById("towerBtn").textContent=showTowers?"Hide towers":"Show towers";draw();\n};\ndocument.getElementById("landmarkBtn").onclick=()=>{\n  showLandmarks=!showLandmarks;document.getElementById("landmarkBtn").textContent=showLandmarks?"Hide landmarks":"Show landmarks";draw();\n};\ndocument.getElementById("calBtn").onclick=()=>{showCalibration=!showCalibration;draw();};'''),
              ('''      <div class="changeEntry">\n        <h4>v1.1.0 — Hosted website support</h4>''',
               '''      <div class="changeEntry">\n        <h4>v1.1.1 — Map display toggles</h4>\n        <ul>\n          <li>Added a dedicated landmark visibility toggle in Settings → Map display.</li>\n          <li>Towers and landmarks can now be hidden or shown independently.</li>\n        </ul>\n      </div>\n\n      <div class="changeEntry">\n        <h4>v1.1.0 — Hosted website support</h4>'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected index.html patch target: {old[:120]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          Path('version.json').write_text('{\n  "version": "1.1.1",\n  "released": "2026-08-25"\n}')

          changelog = Path('CHANGELOG.txt')
          changelog.write_text(
              'v1.1.1\n'
              '- Added a landmark visibility toggle in Settings > Map display\n'
              '- Towers and landmarks can now be hidden or shown independently\n\n'
              + changelog.read_text()
          )

          readme = Path('README.txt')
          r = readme.read_text()
          if 'BIG WALK HIDE + SEEK — PROTOTYPE 1.1.0' not in r:
              raise SystemExit('Missing README version header')
          r = r.replace('BIG WALK HIDE + SEEK — PROTOTYPE 1.1.0',
                        'BIG WALK HIDE + SEEK — PROTOTYPE 1.1.1', 1)
          marker = 'WHAT CHANGED IN 1.1.0\n'
          if marker not in r:
              raise SystemExit('Missing README changelog marker')
          r = r.replace(marker,
              'WHAT CHANGED IN 1.1.1\n'
              '---------------------\n'
              '- Added a dedicated landmark visibility toggle in Settings > Map display.\n'
              '- Towers and landmarks can now be hidden or shown independently.\n\n\n'
              'WHAT CHANGED IN 1.1.0\n', 1)
          readme.write_text(r)
          PY

      - name: Syntax check JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          if not blocks:
              raise SystemExit('No script block found')
          Path('/tmp/bigwalk.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/bigwalk.js
          git diff --check

      - name: Commit update and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/apply-v1.1.1-map-toggles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json CHANGELOG.txt README.txt .github/workflows/apply-v1.1.1-map-toggles.yml
          git commit -m 'Release v1.1.1 map display toggles'
          git push origin main
