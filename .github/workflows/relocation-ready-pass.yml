name: Relocation Ready button pass
on:
  push:
    branches: [v1.2.0-rooms]
    paths: [.github/workflows/relocation-ready-pass.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.0-rooms
          fetch-depth: 0
      - name: Add Hider Ready confirmation
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)

          def patch_index(path):
              p=Path(path); s=p.read_text()

              s=once(s,
              'let relocationSettings={firstAt:1500,interval:1200,window:180,minDistance:250,skipBelow:75};',
              'let relocationSettings={firstAt:1500,interval:1200,window:300,minDistance:250,skipBelow:75};',
              f'{path} default relocation window')

              s=once(s,
              '<input id="relocationWindowMinutes" type="number" min="0.5" step="0.5" value="3">',
              '<input id="relocationWindowMinutes" type="number" min="0.5" step="0.5" value="5">',
              f'{path} relocation window input')

              s=once(s,
              '<div id="relocationMessage" class="small" style="margin-top:8px">The first relocation begins at 25:00.</div>',
              '<div id="relocationMessage" class="small" style="margin-top:8px">The first relocation begins at 25:00.</div>\n        <button class="primary" id="relocationReadyBtn" style="display:none;margin-top:8px">Ready</button>',
              f'{path} relocation ready button')

              s=once(s,
              '''  const plan=localRelocationPlan;if(!plan||plan.invalid||plan.skip)return;\n  const current={x:liveMarker.x,y:liveMarker.y};\n  const displacement=Math.hypot(current.x-plan.start.x,current.y-plan.start.y);\n  if(displacement>=plan.target&&pointInRelocationRegion(current,plan))signalRelocationResult("completed");\n}\n''',
              '''  const plan=localRelocationPlan;if(!plan||plan.invalid||plan.skip)return;\n}\n''',
              f'{path} remove auto relocation completion')

              s=once(s,
              '''  const section=document.getElementById("relocationGameSection"),headline=document.getElementById("relocationHeadline"),status=document.getElementById("relocationStatus"),target=document.getElementById("relocationTarget"),progress=document.getElementById("relocationProgress"),message=document.getElementById("relocationMessage");\n  if(!section)return;\n  section.classList.toggle("relocationActive",!!relocationState.active);\n''',
              '''  const section=document.getElementById("relocationGameSection"),headline=document.getElementById("relocationHeadline"),status=document.getElementById("relocationStatus"),target=document.getElementById("relocationTarget"),progress=document.getElementById("relocationProgress"),message=document.getElementById("relocationMessage"),readyBtn=document.getElementById("relocationReadyBtn");\n  if(!section)return;\n  readyBtn.style.display="none";readyBtn.disabled=true;readyBtn.textContent="Ready";\n  section.classList.toggle("relocationActive",!!relocationState.active);\n''',
              f'{path} ready button render binding')

              s=once(s,
              '''      else{\n        const d=Math.hypot(liveMarker.x-localRelocationPlan.start.x,liveMarker.y-localRelocationPlan.start.y),legal=pointInRelocationRegion(liveMarker,localRelocationPlan);\n        target.textContent=`${Math.round(localRelocationPlan.target)} units${localRelocationPlan.target<relocationSettings.minDistance?" · scaled":""}`;\n        progress.textContent=`${Math.round(d)} / ${Math.round(localRelocationPlan.target)}${legal?"":" · outside connected legal area"}`;\n        message.textContent=localRelocationPlan.signaled?"Relocation complete — waiting for the room to confirm.":"Displacement is measured from where this relocation started, not total distance traveled.";\n      }\n''',
              '''      else{\n        const d=Math.hypot(liveMarker.x-localRelocationPlan.start.x,liveMarker.y-localRelocationPlan.start.y),legal=pointInRelocationRegion(liveMarker,localRelocationPlan),ready=d>=localRelocationPlan.target&&legal;\n        target.textContent=`${Math.round(localRelocationPlan.target)} units${localRelocationPlan.target<relocationSettings.minDistance?" · scaled":""}`;\n        progress.textContent=`${Math.round(d)} / ${Math.round(localRelocationPlan.target)}${legal?"":" · outside connected legal area"}`;\n        readyBtn.style.display=(ready||localRelocationPlan.signaled)?"block":"none";\n        readyBtn.disabled=!ready||localRelocationPlan.signaled;\n        readyBtn.textContent=localRelocationPlan.signaled?"Ready — confirming…":"Ready";\n        message.textContent=localRelocationPlan.signaled?"Ready confirmed — waiting for the room to schedule the next relocation.":ready?"Minimum move reached. Keep searching if you want, then press Ready once you have a hiding spot.":"Displacement is measured from where this relocation started, not total distance traveled.";\n      }\n''',
              f'{path} ready state UI')

              s=once(s,
              '''document.getElementById("applyRelocationSettingsBtn").onclick=()=>{\n''',
              '''document.getElementById("relocationReadyBtn").onclick=()=>{\n  if(!isRoomHider()||!relocationState.active||!localRelocationPlan||localRelocationPlan.invalid||localRelocationPlan.skip||localRelocationPlan.signaled)return;\n  if(!liveMarker)return;\n  const current={x:liveMarker.x,y:liveMarker.y};\n  const displacement=Math.hypot(current.x-localRelocationPlan.start.x,current.y-localRelocationPlan.start.y);\n  if(displacement<localRelocationPlan.target||!pointInRelocationRegion(current,localRelocationPlan))return;\n  signalRelocationResult("completed");\n  renderMatchTimer();\n};\ndocument.getElementById("applyRelocationSettingsBtn").onclick=()=>{\n''',
              f'{path} ready button handler')

              p.write_text(s)

          patch_index('index.html')
          PY
      - name: Validate source branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          assert 'id="relocationReadyBtn"' in s
          assert 'window:300' in s
          PY
          node --check /tmp/index-inline.js
          git diff --check
      - name: Commit source change
        run: |
          rm .github/workflows/relocation-ready-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/relocation-ready-pass.yml
          git commit -m 'Add Hider relocation Ready confirmation'
          git push origin HEAD:v1.2.0-rooms
      - name: Patch isolated Rooms preview
        run: |
          git checkout -B main origin/main
          python - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)

          p=Path('rooms-preview/index.html'); s=p.read_text()
          s=once(s,
          'let relocationSettings={firstAt:1500,interval:1200,window:180,minDistance:250,skipBelow:75};',
          'let relocationSettings={firstAt:1500,interval:1200,window:300,minDistance:250,skipBelow:75};',
          'preview default relocation window')
          s=once(s,
          '<input id="relocationWindowMinutes" type="number" min="0.5" step="0.5" value="3">',
          '<input id="relocationWindowMinutes" type="number" min="0.5" step="0.5" value="5">',
          'preview relocation window input')
          s=once(s,
          '<div id="relocationMessage" class="small" style="margin-top:8px">The first relocation begins at 25:00.</div>',
          '<div id="relocationMessage" class="small" style="margin-top:8px">The first relocation begins at 25:00.</div>\n        <button class="primary" id="relocationReadyBtn" style="display:none;margin-top:8px">Ready</button>',
          'preview ready button')
          s=once(s,
          '''  const plan=localRelocationPlan;if(!plan||plan.invalid||plan.skip)return;\n  const current={x:liveMarker.x,y:liveMarker.y};\n  const displacement=Math.hypot(current.x-plan.start.x,current.y-plan.start.y);\n  if(displacement>=plan.target&&pointInRelocationRegion(current,plan))signalRelocationResult("completed");\n}\n''',
          '''  const plan=localRelocationPlan;if(!plan||plan.invalid||plan.skip)return;\n}\n''',
          'preview remove auto completion')
          s=once(s,
          '''  const section=document.getElementById("relocationGameSection"),headline=document.getElementById("relocationHeadline"),status=document.getElementById("relocationStatus"),target=document.getElementById("relocationTarget"),progress=document.getElementById("relocationProgress"),message=document.getElementById("relocationMessage");\n  if(!section)return;\n  section.classList.toggle("relocationActive",!!relocationState.active);\n''',
          '''  const section=document.getElementById("relocationGameSection"),headline=document.getElementById("relocationHeadline"),status=document.getElementById("relocationStatus"),target=document.getElementById("relocationTarget"),progress=document.getElementById("relocationProgress"),message=document.getElementById("relocationMessage"),readyBtn=document.getElementById("relocationReadyBtn");\n  if(!section)return;\n  readyBtn.style.display="none";readyBtn.disabled=true;readyBtn.textContent="Ready";\n  section.classList.toggle("relocationActive",!!relocationState.active);\n''',
          'preview ready render binding')
          s=once(s,
          '''      else{\n        const d=Math.hypot(liveMarker.x-localRelocationPlan.start.x,liveMarker.y-localRelocationPlan.start.y),legal=pointInRelocationRegion(liveMarker,localRelocationPlan);\n        target.textContent=`${Math.round(localRelocationPlan.target)} units${localRelocationPlan.target<relocationSettings.minDistance?" · scaled":""}`;\n        progress.textContent=`${Math.round(d)} / ${Math.round(localRelocationPlan.target)}${legal?"":" · outside connected legal area"}`;\n        message.textContent=localRelocationPlan.signaled?"Relocation complete — waiting for the room to confirm.":"Displacement is measured from where this relocation started, not total distance traveled.";\n      }\n''',
          '''      else{\n        const d=Math.hypot(liveMarker.x-localRelocationPlan.start.x,liveMarker.y-localRelocationPlan.start.y),legal=pointInRelocationRegion(liveMarker,localRelocationPlan),ready=d>=localRelocationPlan.target&&legal;\n        target.textContent=`${Math.round(localRelocationPlan.target)} units${localRelocationPlan.target<relocationSettings.minDistance?" · scaled":""}`;\n        progress.textContent=`${Math.round(d)} / ${Math.round(localRelocationPlan.target)}${legal?"":" · outside connected legal area"}`;\n        readyBtn.style.display=(ready||localRelocationPlan.signaled)?"block":"none";\n        readyBtn.disabled=!ready||localRelocationPlan.signaled;\n        readyBtn.textContent=localRelocationPlan.signaled?"Ready — confirming…":"Ready";\n        message.textContent=localRelocationPlan.signaled?"Ready confirmed — waiting for the room to schedule the next relocation.":ready?"Minimum move reached. Keep searching if you want, then press Ready once you have a hiding spot.":"Displacement is measured from where this relocation started, not total distance traveled.";\n      }\n''',
          'preview ready UI')
          s=once(s,
          '''document.getElementById("applyRelocationSettingsBtn").onclick=()=>{\n''',
          '''document.getElementById("relocationReadyBtn").onclick=()=>{\n  if(!isRoomHider()||!relocationState.active||!localRelocationPlan||localRelocationPlan.invalid||localRelocationPlan.skip||localRelocationPlan.signaled)return;\n  if(!liveMarker)return;\n  const current={x:liveMarker.x,y:liveMarker.y};\n  const displacement=Math.hypot(current.x-localRelocationPlan.start.x,current.y-localRelocationPlan.start.y);\n  if(displacement<localRelocationPlan.target||!pointInRelocationRegion(current,localRelocationPlan))return;\n  signalRelocationResult("completed");\n  renderMatchTimer();\n};\ndocument.getElementById("applyRelocationSettingsBtn").onclick=()=>{\n''',
          'preview ready handler')
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('rooms-preview/index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/preview-inline.js').write_text('\n'.join(scripts))
          assert 'id="relocationReadyBtn"' in s
          assert 'window:300' in s
          PY
          node --check /tmp/preview-inline.js
          grep -q 'src="../big-walk-map.png"' rooms-preview/index.html
          git diff --check
          git add rooms-preview/index.html
          git commit -m 'Add relocation Ready button to Rooms preview'
          git push origin HEAD:main
