name: Build v1.3 Cross the Zone mission

on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/v13-cross-zone-mission.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch Cross the Zone mission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s=s.replace(old,new,1)

          # CSS
          once(
              '  .relocationActive{border-color:#704f8e;background:#2a1d34}\n',
              '  .relocationActive{border-color:#704f8e;background:#2a1d34}\n'
              '  .missionBig{text-align:center;font-size:28px;font-weight:900;color:#c99cff;margin:2px 0 8px}\n'
              '  .missionActive{border-color:#815ac0;background:#261b36}\n'
              '  .powerCharge{font-weight:900;color:#e4c8ff}\n',
              'mission css anchor')

          # Game mission card
          relocation_card='''      <section id="relocationGameSection">\n        <h3>Forced relocation</h3>\n        <div class="relocationBig" id="relocationHeadline">25:00</div>\n        <div class="metric"><b>Status</b><span id="relocationStatus">Waiting</span></div>\n        <div class="metric"><b>Minimum move</b><span id="relocationTarget">250 units</span></div>\n        <div class="metric"><b>Progress</b><span id="relocationProgress">—</span></div>\n        <div id="relocationMessage" class="small" style="margin-top:8px">The first relocation begins at 25:00.</div>\n        <button class="primary" id="relocationReadyBtn" style="display:none;margin-top:8px">Ready</button>\n      </section>\n'''
          mission_card=relocation_card+'''\n      <section id="missionGameSection">\n        <h3>Hider mission</h3>\n        <div class="missionBig" id="missionHeadline">10:00</div>\n        <div class="metric"><b>Status</b><span id="missionStatus">Waiting</span></div>\n        <div class="metric"><b>Mission</b><span id="missionType">Cross the Zone</span></div>\n        <div class="metric"><b>Progress</b><span id="missionProgress">—</span></div>\n        <div class="metric"><b>Power Charges</b><span class="powerCharge" id="hiderPowerCharges">0</span></div>\n        <div id="missionMessage" class="small" style="margin-top:8px">First mission becomes available at 10:00.</div>\n      </section>\n'''
          once(relocation_card,mission_card,'mission card anchor')

          # Room description
          once(
              '          <p class="small">Match timer, pause/reset state, question unlock schedule, global question cooldown, question history, and search-area constraints sync across the room. Markers and live player position stay local.</p>',
              '          <p class="small">Match timer, pause/reset state, question unlock schedule, global question cooldown, question history, search-area constraints, mission state, and Power Charges sync across the room. Markers, live player position, and Hider mission target coordinates stay local.</p>',
              'room share description')

          # Changelog entry
          changelog_anchor='''      <div class="changeEntry">\n        <h4>v1.2.0 — Multiplayer rooms + live gameplay</h4>'''
          changelog_new='''      <div class="changeEntry">\n        <h4>v1.3.0 preview — Hider missions</h4>\n        <ul>\n          <li>Added Cross the Zone as the first Hider mission.</li>\n          <li>Cross the Zone privately highlights a purple far-side target inside the connected legal search area.</li>\n          <li>Starting the mission cancels the pending forced-relocation countdown; completing or cancelling it starts a fresh relocation interval.</li>\n          <li>Mission completion awards one Power Charge for the upcoming Hider power system.</li>\n          <li>Mission targets remain local to the Hider browser and are never uploaded to the room.</li>\n        </ul>\n      </div>\n      <div class="changeEntry">\n        <h4>v1.2.0 — Multiplayer rooms + live gameplay</h4>'''
          once(changelog_anchor,changelog_new,'changelog anchor')

          # Build id + room module cache key
          once('const REQUIRED_ROOMS_BUILD_ID="v13-overtime-20260827b";','const REQUIRED_ROOMS_BUILD_ID="v13-missions-20260827a";','required rooms build id')
          once('<script type="module" src="rooms.js?v=v13-overtime-20260827b"></script>','<script type="module" src="rooms.js?v=v13-missions-20260827a"></script>','rooms module cache key')

          # Mission state variables
          var_anchor='''let relocationSettings={firstAt:1500,interval:1200,window:300,minDistance:250,skipBelow:75};\nlet relocationState={active:false,index:0,nextAt:1500,startedAt:null,deadline:null,lastResult:""};\nlet localRelocationPlan=null,relocationMutationBusy=false;\nlet relocationSchedulerError="";'''
          var_new='''let relocationSettings={firstAt:1500,interval:1200,window:300,minDistance:250,skipBelow:75};\nlet relocationState={active:false,index:0,nextAt:1500,startedAt:null,deadline:null,lastResult:""};\nlet localRelocationPlan=null,relocationMutationBusy=false;\nlet relocationSchedulerError="";\nlet missionSettings={firstAt:600,minInterval:600,maxInterval:900};\nlet missionState={active:false,index:0,nextAt:600,type:"crossZone",startedAt:null,lastResult:"",token:""};\nlet hiderPowerCharges=0;\nlet localHiderMissionPlan=null,missionMutationBusy=false;\nlet missionSchedulerError="";'''
          once(var_anchor,var_new,'mission state variables')

          # Sound cues
          once(
              '  else if(name==="relocationComplete"){tone(392,.00,.11,.55,"triangle");tone(523,.09,.13,.65,"triangle");tone(659,.19,.24,.8,"sine");}\n  else if(name==="matchStart")',
              '  else if(name==="relocationComplete"){tone(392,.00,.11,.55,"triangle");tone(523,.09,.13,.65,"triangle");tone(659,.19,.24,.8,"sine");}\n'
              '  else if(name==="missionStart"){tone(523,.00,.12,.65,"triangle");tone(659,.10,.13,.72,"triangle");tone(784,.21,.24,.85,"sine");}\n'
              '  else if(name==="missionComplete"){tone(659,.00,.12,.65,"triangle");tone(784,.10,.13,.75,"triangle");tone(1047,.21,.28,.9,"sine");}\n'
              '  else if(name==="missionCancel"){tone(330,.00,.15,.6,"triangle");tone(247,.13,.24,.7,"sine");}\n'
              '  else if(name==="matchStart")',
              'mission sounds')

          # Audio state and transitions
          once(
              '    relocationIndex:Number(relocationState.index||0),\n    relocationReady:localRelocationReadyNow()\n',
              '    relocationIndex:Number(relocationState.index||0),\n    relocationReady:localRelocationReadyNow(),\n    missionActive:roomModeConnected()&&!!missionState.active,\n    missionIndex:Number(missionState.index||0),\n    missionLastResult:String(missionState.lastResult||"")\n',
              'audio mission state')
          once(
              '  if(prev.relocationActive&&!now.relocationActive)playGameSound("relocationComplete");\n  if(!prev.relocationReady&&now.relocationReady)playGameSound("relocationReady");\n',
              '  if(prev.relocationActive&&!now.relocationActive)playGameSound("relocationComplete");\n'
              '  if(!prev.relocationReady&&now.relocationReady)playGameSound("relocationReady");\n'
              '  if(!prev.missionActive&&now.missionActive)playGameSound("missionStart");\n'
              '  if(prev.missionActive&&!now.missionActive)playGameSound(now.missionLastResult==="completed"?"missionComplete":"missionCancel");\n',
              'audio mission transitions')

          # Scheduler authority host-only for deterministic mission/relocation interaction
          once(
              'function roomCanDriveRelocation(){return roomModeConnected()&&(!!window.BigWalkRooms?.isHost?.()||roomRole()==="seeker");}',
              'function roomCanDriveRelocation(){return roomModeConnected()&&!!window.BigWalkRooms?.isHost?.();}\nfunction roomCanDriveMission(){return roomModeConnected()&&!!window.BigWalkRooms?.isHost?.();}',
              'scheduler authority')

          # Mission helpers after overtime refresh function
          refresh_anchor='''function refreshTransientMapOverlays(){\n  const visible=!!activeOvertimeReveal();\n  if(visible||overtimeRevealWasVisible)draw();\n  overtimeRevealWasVisible=visible;\n}\n'''
          mission_helpers=refresh_anchor+'''\nfunction missionConstraintKey(){\n  try{return JSON.stringify(constraints||[]);}catch{return String((constraints||[]).length);}\n}\nfunction resetLocalHiderMissionPlan(){\n  localHiderMissionPlan=null;\n  localHiderMissionTargetCells=null;\n}\nfunction makeMissionToken(){\n  if(globalThis.crypto?.randomUUID)return `mission-${crypto.randomUUID()}`;\n  const a=new Uint32Array(4);crypto.getRandomValues(a);\n  return `mission-${Date.now()}-${Array.from(a,n=>n.toString(36)).join("")}`;\n}\nfunction nextMissionDelay(){\n  const lo=Math.max(60,Number(missionSettings.minInterval||600));\n  const hi=Math.max(lo,Number(missionSettings.maxInterval||900));\n  return Math.round((lo+Math.random()*(hi-lo))/15)*15;\n}\nfunction buildCrossZoneMissionPlan(start){\n  const region=buildRelocationPlan(start);\n  if(!region||region.invalid||!region.seen||!region.seen.size)return {index:Number(missionState.index||0),token:String(missionState.token||""),invalid:true};\n  const cells=Array.from(region.seen,key=>{\n    const [x,y]=key.split(",").map(Number);\n    return {x,y,size:Number(region.step||25),key,distance:Math.hypot(x-start.x,y-start.y)};\n  }).filter(c=>Number.isFinite(c.x)&&Number.isFinite(c.y));\n  if(cells.length<4)return {index:Number(missionState.index||0),token:String(missionState.token||""),invalid:true};\n  let farthest=cells[0];\n  for(const c of cells)if(c.distance>farthest.distance)farthest=c;\n  if(!farthest||farthest.distance<100)return {index:Number(missionState.index||0),token:String(missionState.token||""),invalid:true};\n  const vx=farthest.x-start.x,vy=farthest.y-start.y,len=Math.hypot(vx,vy);\n  if(len<1)return {index:Number(missionState.index||0),token:String(missionState.token||""),invalid:true};\n  const ux=vx/len,uy=vy/len;\n  for(const c of cells)c.projection=(c.x-start.x)*ux+(c.y-start.y)*uy;\n  const maxProjection=Math.max(...cells.map(c=>c.projection));\n  let targetCells=cells.filter(c=>c.projection>=maxProjection*.72&&c.projection<=maxProjection*.90&&c.distance>=farthest.distance*.55);\n  if(targetCells.length<4)targetCells=cells.filter(c=>c.projection>=maxProjection*.70&&c.projection<=maxProjection*.97&&c.distance>=farthest.distance*.50);\n  if(targetCells.length<3)targetCells=cells.filter(c=>c.projection>=maxProjection*.70);\n  if(!targetCells.length)return {index:Number(missionState.index||0),token:String(missionState.token||""),invalid:true};\n  return {\n    index:Number(missionState.index||0),token:String(missionState.token||""),start:{x:Number(start.x),y:Number(start.y)},\n    step:Number(region.step||25),targetCells,targetKeys:new Set(targetCells.map(c=>c.key)),\n    constraintKey:missionConstraintKey(),signaled:false,pendingResult:"",invalid:false\n  };\n}\nfunction pointInMissionTarget(p,plan){\n  if(!p||!plan?.targetKeys||!plan.step)return false;\n  const x=Math.round(Number(p.x)/plan.step)*plan.step,y=Math.round(Number(p.y)/plan.step)*plan.step;\n  return plan.targetKeys.has(relocationCellKey(x,y));\n}\nfunction missionDistanceToTarget(p,plan){\n  if(!p||!Array.isArray(plan?.targetCells)||!plan.targetCells.length)return Number.NaN;\n  let best=Infinity;\n  for(const c of plan.targetCells)best=Math.min(best,Math.hypot(Number(p.x)-c.x,Number(p.y)-c.y));\n  return best;\n}\nfunction signalMissionResult(result){\n  const plan=localHiderMissionPlan;\n  if(!plan||plan.signaled||!missionState.active)return;\n  plan.signaled=true;plan.pendingResult=String(result||"cancelled");\n  Promise.resolve(window.BigWalkRooms?.signalMissionResult?.(missionState.index,plan.pendingResult,missionState.token)).catch(err=>{\n    console.warn("Mission result signal failed",err);plan.signaled=false;plan.pendingResult="";\n  });\n}\nfunction updateLocalHiderMission(){\n  if(!roomModeConnected()||!missionState.active||!isRoomHider()){\n    if(!missionState.active)resetLocalHiderMissionPlan();\n    return;\n  }\n  if(!roomMatchRunning()||!liveMarker)return;\n  const index=Number(missionState.index||0),token=String(missionState.token||"");\n  if(!index||!token)return;\n  if(!localHiderMissionPlan||localHiderMissionPlan.index!==index||localHiderMissionPlan.token!==token){\n    localHiderMissionPlan=buildCrossZoneMissionPlan({x:Number(liveMarker.x),y:Number(liveMarker.y)});\n    if(localHiderMissionPlan.invalid){signalMissionResult("cancelled");return;}\n    localHiderMissionTargetCells=localHiderMissionPlan.targetCells.map(c=>({x:c.x,y:c.y,size:c.size}));\n    if(appInitialized)draw();\n  }\n  const plan=localHiderMissionPlan;\n  if(!plan||plan.invalid||plan.signaled)return;\n  const currentConstraintKey=missionConstraintKey();\n  if(currentConstraintKey!==plan.constraintKey){\n    const reachable=buildRelocationPlan({x:Number(liveMarker.x),y:Number(liveMarker.y)});\n    if(!reachable||reachable.invalid||!reachable.seen){signalMissionResult("cancelled");return;}\n    const valid=plan.targetCells.filter(c=>reachable.seen.has(c.key)&&allowedAt(c.x,c.y));\n    if(!valid.length){signalMissionResult("cancelled");return;}\n    plan.targetCells=valid;plan.targetKeys=new Set(valid.map(c=>c.key));plan.constraintKey=currentConstraintKey;\n    localHiderMissionTargetCells=valid.map(c=>({x:c.x,y:c.y,size:c.size}));\n    if(appInitialized)draw();\n  }\n  if(pointInMissionTarget(liveMarker,plan))signalMissionResult("completed");\n}\nasync function maybeHostAdvanceMission(){\n  if(!roomModeConnected()||!roomCanDriveMission()||missionMutationBusy||!roomMatchRunning())return;\n  const now=currentMatchSeconds();\n  if(missionState.active){\n    if(!window.BigWalkRooms?.hasHider?.()){\n      missionMutationBusy=true;\n      try{\n        missionState={...missionState,active:false,nextAt:now+nextMissionDelay(),startedAt:null,lastResult:"cancelled",token:""};\n        relocationState={...relocationState,active:false,nextAt:now+relocationSettings.interval,startedAt:null,deadline:null};\n        resetLocalHiderMissionPlan();\n        await window.BigWalkRooms.pushGameState();\n      }finally{missionMutationBusy=false;}\n      return;\n    }\n    const signal=window.BigWalkRooms?.getHiderMissionSignal?.();\n    if(signal&&Number(signal.index)===Number(missionState.index)&&String(signal.token||"")===String(missionState.token||"")&&signal.result){\n      missionMutationBusy=true;\n      try{\n        const result=String(signal.result);\n        if(result==="completed")hiderPowerCharges=Math.max(0,Number(hiderPowerCharges||0))+1;\n        missionState={...missionState,active:false,nextAt:now+nextMissionDelay(),startedAt:null,lastResult:result,token:""};\n        relocationState={...relocationState,active:false,nextAt:now+relocationSettings.interval,startedAt:null,deadline:null};\n        resetLocalHiderMissionPlan();\n        await window.BigWalkRooms.pushGameState();\n      }finally{missionMutationBusy=false;}\n    }\n    return;\n  }\n  if(relocationState.active||!window.BigWalkRooms?.hasHider?.())return;\n  const nextAt=Number(missionState.nextAt??missionSettings.firstAt);\n  if(!Number.isFinite(nextAt)||now+.01<nextAt)return;\n  missionMutationBusy=true;\n  try{\n    missionState={active:true,index:Number(missionState.index||0)+1,nextAt:null,type:"crossZone",startedAt:now,lastResult:"",token:makeMissionToken()};\n    relocationState={...relocationState,nextAt:null};\n    resetLocalHiderMissionPlan();\n    await window.BigWalkRooms.pushGameState();\n  }finally{missionMutationBusy=false;}\n}\nfunction updateMissionUi(){\n  const section=document.getElementById("missionGameSection"),headline=document.getElementById("missionHeadline"),status=document.getElementById("missionStatus"),type=document.getElementById("missionType"),progress=document.getElementById("missionProgress"),charges=document.getElementById("hiderPowerCharges"),message=document.getElementById("missionMessage");\n  if(!section)return;\n  section.classList.toggle("missionActive",!!missionState.active);\n  type.textContent="Cross the Zone";\n  charges.textContent=isRoomHider()||!roomModeConnected()?String(Math.max(0,Number(hiderPowerCharges||0))):"Hidden";\n  const now=currentMatchSeconds();\n  if(!roomModeConnected()){\n    headline.textContent=formatTime(Math.max(0,Number(missionState.nextAt??missionSettings.firstAt)-now));status.textContent="Rooms required";progress.textContent="—";message.textContent="Hider missions activate during shared room matches.";return;\n  }\n  if(missionState.active){\n    headline.textContent="ACTIVE";\n    if(isRoomHider()){\n      status.textContent="Cross the Zone";\n      if(!liveMarker){progress.textContent="Waiting for live tracker";message.textContent="Connect live location to generate your private purple target area.";}\n      else if(!localHiderMissionPlan){progress.textContent="Calculating…";message.textContent="Finding the opposite side of the connected legal search area.";}\n      else if(localHiderMissionPlan.invalid){progress.textContent="Cancelling…";message.textContent="No safe opposite-side target is available. The relocation timer will restart fresh.";}\n      else if(localHiderMissionPlan.signaled){progress.textContent=localHiderMissionPlan.pendingResult==="completed"?"Target reached":"Cancelling";message.textContent=localHiderMissionPlan.pendingResult==="completed"?"Mission complete — confirming your Power Charge and restarting the relocation timer.":"Mission target became invalid — restarting the relocation timer.";}\n      else{\n        const d=missionDistanceToTarget(liveMarker,localHiderMissionPlan);\n        progress.textContent=Number.isFinite(d)?`${Math.max(0,Math.round(d))} units to target`:"Target active";\n        message.textContent="Reach the purple target area on the opposite side of the remaining legal search zone. The target is visible only to you.";\n      }\n    }else{\n      status.textContent="Hider mission in progress";progress.textContent="Target hidden";message.textContent="Cross the Zone is active. The Hider's purple target and live position remain private; forced relocation will restart fresh when the mission ends.";\n    }\n    return;\n  }\n  const nextAt=Number(missionState.nextAt??missionSettings.firstAt),remaining=Math.max(0,nextAt-now);\n  headline.textContent=formatTime(remaining);progress.textContent="—";\n  status.textContent=missionState.lastResult?`Last: ${missionState.lastResult}`:"Waiting";\n  if(missionSchedulerError)message.textContent=`Mission scheduler error: ${missionSchedulerError}`;\n  else if(!window.BigWalkRooms?.hasHider?.())message.textContent="Waiting for a Hider before the next mission can begin.";\n  else message.textContent=`Next mission in ${formatTime(remaining)}. After a mission ends, the next one is scheduled randomly 10–15 minutes later.`;\n}\n'''
          once(refresh_anchor,mission_helpers,'mission helpers')

          # Relocation cannot start while mission active; mission cancels the timer in UI
          once(
              'async function maybeHostAdvanceRelocation(){\n  if(!roomModeConnected()||!roomCanDriveRelocation()||relocationMutationBusy||!roomMatchRunning())return;\n',
              'async function maybeHostAdvanceRelocation(){\n  if(!roomModeConnected()||!roomCanDriveRelocation()||relocationMutationBusy||!roomMatchRunning())return;\n  if(missionState.active&&!relocationState.active)return;\n',
              'relocation mission guard')
          once(
              '  }else{\n    const next=Math.max(0,Number(relocationState.nextAt||relocationSettings.firstAt)-now);\n    headline.textContent=formatTime(next);target.textContent=`${relocationSettings.minDistance} units`;progress.textContent="—";\n',
              '  }else{\n    if(missionState.active){\n      headline.textContent="MISSION";status.textContent="Countdown cancelled";target.textContent=`${relocationSettings.minDistance} units`;progress.textContent="—";message.textContent="Cross the Zone is active. This relocation countdown was cancelled; a fresh full interval starts when the mission ends.";return;\n    }\n    const next=Math.max(0,Number(relocationState.nextAt??relocationSettings.firstAt)-now);\n    headline.textContent=formatTime(next);target.textContent=`${relocationSettings.minDistance} units`;progress.textContent="—";\n',
              'relocation mission ui')

          # Shared game state
          once(
              '    return {constraints:JSON.parse(JSON.stringify(constraints||[])),historyText:[...(historyText||[])],questionCooldownUntil:Number(questionCooldownUntil||0),unlockTimes:{...unlockTimes},questionCooldownSeconds:Number(questionCooldownSeconds||300),seekerPointsSpent:Number(seekerPointsSpent||0),relocationSettings:{...relocationSettings},relocationState:{...relocationState}};',
              '    return {constraints:JSON.parse(JSON.stringify(constraints||[])),historyText:[...(historyText||[])],questionCooldownUntil:Number(questionCooldownUntil||0),unlockTimes:{...unlockTimes},questionCooldownSeconds:Number(questionCooldownSeconds||300),seekerPointsSpent:Number(seekerPointsSpent||0),relocationSettings:{...relocationSettings},relocationState:{...relocationState},missionSettings:{...missionSettings},missionState:{...missionState},hiderPowerCharges:Number(hiderPowerCharges||0)};',
              'shared game mission state')
          once(
              '      if(game.relocationState&&typeof game.relocationState==="object"){\n        const incoming={...relocationState,...game.relocationState};\n        if(Number(incoming.index)!==Number(relocationState.index)||!incoming.active)resetLocalRelocationPlan();\n        relocationState=incoming;\n      }\n',
              '      if(game.relocationState&&typeof game.relocationState==="object"){\n        const incoming={...relocationState,...game.relocationState};\n        if(Number(incoming.index)!==Number(relocationState.index)||!incoming.active)resetLocalRelocationPlan();\n        relocationState=incoming;\n      }\n'
              '      if(game.missionSettings&&typeof game.missionSettings==="object")missionSettings={...missionSettings,...game.missionSettings};\n'
              '      if(game.missionState&&typeof game.missionState==="object"){\n'
              '        const incomingMission={...missionState,...game.missionState};\n'
              '        if(Number(incomingMission.index)!==Number(missionState.index)||String(incomingMission.token||"")!==String(missionState.token||"")||!incomingMission.active)resetLocalHiderMissionPlan();\n'
              '        missionState=incomingMission;\n'
              '      }\n'
              '      hiderPowerCharges=Math.max(0,Number(game.hiderPowerCharges||0));\n',
              'apply mission shared state')
          once(
              '      relocationState={active:false,index:0,nextAt:relocationSettings.firstAt,startedAt:null,deadline:null,lastResult:""};resetLocalRelocationPlan();localRelocationOvertimeSnapshot=null;localRelocationOvertimeSignalIndex=0;\n',
              '      relocationState={active:false,index:0,nextAt:relocationSettings.firstAt,startedAt:null,deadline:null,lastResult:""};resetLocalRelocationPlan();localRelocationOvertimeSnapshot=null;localRelocationOvertimeSignalIndex=0;\n'
              '      missionState={active:false,index:0,nextAt:missionSettings.firstAt,type:"crossZone",startedAt:null,lastResult:"",token:""};hiderPowerCharges=0;resetLocalHiderMissionPlan();\n',
              'room reset mission state')

          # Render + scheduler tick + local reset
          once(
              '  updateLocalRelocation();updateRelocationUi();\n  updateQuestionLocks();updateMilestones();updateRuleTimes();updateSeekerPointsDisplay();\n',
              '  updateLocalRelocation();updateRelocationUi();updateLocalHiderMission();updateMissionUi();\n  updateQuestionLocks();updateMilestones();updateRuleTimes();updateSeekerPointsDisplay();\n',
              'render mission ui')
          once(
              '''  if(roomModeConnected()){\n    maybeHostAdvanceRelocation().then(()=>{relocationSchedulerError="";}).catch(err=>{\n      relocationSchedulerError=String(err?.message||err);\n      console.warn("Relocation state update failed",err);\n    });\n    renderMatchTimer();updateGameAudioEvents();refreshTransientMapOverlays();return;\n  }''',
              '''  if(roomModeConnected()){\n    Promise.resolve()\n      .then(()=>maybeHostAdvanceMission())\n      .then(()=>{missionSchedulerError="";return maybeHostAdvanceRelocation();})\n      .then(()=>{relocationSchedulerError="";})\n      .catch(err=>{\n        const msg=String(err?.message||err);missionSchedulerError=msg;relocationSchedulerError=msg;\n        console.warn("Mission/relocation state update failed",err);\n      });\n    renderMatchTimer();updateGameAudioEvents();refreshTransientMapOverlays();return;\n  }''',
              'tick mission scheduler')
          once(
              '  relocationState={active:false,index:0,nextAt:relocationSettings.firstAt,startedAt:null,deadline:null,lastResult:""};resetLocalRelocationPlan();localRelocationOvertimeSnapshot=null;localRelocationOvertimeSignalIndex=0;\n',
              '  relocationState={active:false,index:0,nextAt:relocationSettings.firstAt,startedAt:null,deadline:null,lastResult:""};resetLocalRelocationPlan();localRelocationOvertimeSnapshot=null;localRelocationOvertimeSignalIndex=0;\n'
              '  missionState={active:false,index:0,nextAt:missionSettings.firstAt,type:"crossZone",startedAt:null,lastResult:"",token:""};hiderPowerCharges=0;resetLocalHiderMissionPlan();\n',
              'local reset mission state')

          # Relocation settings should not resurrect countdown during a mission
          once(
              '  if(!relocationState.active){relocationState.nextAt=relocationState.index===0?relocationSettings.firstAt:currentMatchSeconds()+relocationSettings.interval;}',
              '  if(!relocationState.active&&!missionState.active){relocationState.nextAt=relocationState.index===0?relocationSettings.firstAt:currentMatchSeconds()+relocationSettings.interval;}',
              'relocation settings mission guard')

          p.write_text(s,encoding='utf-8')

          # rooms.js mission signals and cache build id
          rp=Path('rooms.js')
          r=rp.read_text(encoding='utf-8')
          def ronce(old,new,label):
              global r
              count=r.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              r=r.replace(old,new,1)

          ronce('const ROOMS_BUILD_ID = "v13-overtime-20260827b";','const ROOMS_BUILD_ID = "v13-missions-20260827a";','rooms build id')
          overtime_fn='''async function signalRelocationOvertime(index,x,y,token=""){\n  if(!isConnected() || roomRole!=="hider" || !Number.isFinite(Number(x)) || !Number.isFinite(Number(y)))return false;\n  const {dbMod}=firebase;\n  await dbMod.update(dbMod.ref(db, `rooms/${roomCode}/members/${user.uid}`), {\n    relocationOvertimeIndex:Number(index||0),\n    relocationOvertimeX:Number(x),\n    relocationOvertimeY:Number(y),\n    relocationOvertimeToken:String(token||"").slice(0,96),\n    relocationOvertimeAt:dbMod.serverTimestamp(),\n    lastSeen:dbMod.serverTimestamp(),\n  });\n  return true;\n}\n'''
          mission_signal= overtime_fn+'''\nfunction getHiderMissionSignal(){\n  const entry=hiderMemberEntry();\n  if(!entry)return null;\n  const [uid,m]=entry;\n  return {uid,index:Number(m?.missionResultIndex||0),result:String(m?.missionResult||""),token:String(m?.missionResultToken||"")};\n}\nasync function signalMissionResult(index,result="completed",token=""){\n  if(!isConnected() || roomRole!=="hider")return false;\n  const cleanResult=result==="completed"?"completed":"cancelled";\n  const {dbMod}=firebase;\n  await dbMod.update(dbMod.ref(db, `rooms/${roomCode}/members/${user.uid}`), {\n    missionResultIndex:Number(index||0),\n    missionResult:cleanResult,\n    missionResultToken:String(token||"").slice(0,128),\n    lastSeen:dbMod.serverTimestamp(),\n  });\n  return true;\n}\n'''
          ronce(overtime_fn,mission_signal,'rooms mission signal functions')
          ronce(
              '  getHiderOvertimeSignal,\n  signalRelocationOvertime,\n  getServerNow:()=>serverNow(),',
              '  getHiderOvertimeSignal,\n  signalRelocationOvertime,\n  getHiderMissionSignal,\n  signalMissionResult,\n  getServerNow:()=>serverNow(),',
              'rooms mission exports')
          rp.write_text(r,encoding='utf-8')
          PY

      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          r=Path('rooms.js').read_text(encoding='utf-8')
          checks=[
            'missionState={active:false,index:0,nextAt:600',
            'function buildCrossZoneMissionPlan',
            'function maybeHostAdvanceMission',
            'function updateLocalHiderMission',
            'function updateMissionUi',
            'hiderPowerCharges',
            'v13-missions-20260827a',
            '300-unit-diameter area',
          ]
          for c in checks:
              assert c in s,c
          assert 'getHiderMissionSignal' in r
          assert 'signalMissionResult' in r
          assert 'v13-missions-20260827a' in r
          assert 'v13-overtime-20260827b' not in s+r
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check

      - name: Commit source
        run: |
          rm .github/workflows/v13-cross-zone-mission.yml
          git add index.html rooms.js .github/workflows/v13-cross-zone-mission.yml
          git commit -m "Add v1.3 Cross the Zone mission"
          git push origin v1.3.0-hider
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish isolated v1.3 preview
        run: |
          git checkout main
          git pull --ff-only origin main
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"')!=1:
              raise SystemExit('unexpected preview map path count')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1)
          p.write_text(s,encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/preview.js').write_text(s[start:end],encoding='utf-8')
          assert 'function buildCrossZoneMissionPlan' in s
          assert 'v13-missions-20260827a' in s
          assert 'src="../big-walk-map.png"' in s
          PY
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Publish v1.3 Cross the Zone mission preview"
          git push origin main
