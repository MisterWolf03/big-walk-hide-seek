name: Apply Core 0.0.17 Hotfix

on:
  push:
    branches: [mod-prototype]
    paths:
      - '.github/workflows/apply-core-0.0.17-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod-prototype
          fetch-depth: 0

      - name: Patch Core source
        run: python dev-tools/apply_core_0_0_17_hotfix.py

      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo 'No changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add in-game-mod/core/CoreEntry.cs in-game-mod/core/BigWalkHideSeek.Core.csproj
          git commit -m 'Fix question map constraints and timer clipping'
          git push origin HEAD:mod-prototype
