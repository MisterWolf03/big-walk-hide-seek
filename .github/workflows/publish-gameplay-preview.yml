name: Publish gameplay Rooms preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-gameplay-preview.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy verified Rooms gameplay files
        run: |
          git fetch origin v1.2.0-rooms
          git show origin/v1.2.0-rooms:index.html > rooms-preview/index.html
          git show origin/v1.2.0-rooms:rooms.js > rooms-preview/rooms.js
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('rooms-preview/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          if not scripts: raise SystemExit('No inline scripts')
          Path('/tmp/preview-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/preview-inline.js
          node --check rooms-preview/rooms.js
          git diff --check
      - name: Commit preview update
        run: |
          rm .github/workflows/publish-gameplay-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rooms-preview/index.html rooms-preview/rooms.js .github/workflows/publish-gameplay-preview.yml
          git commit -m 'Publish gameplay Rooms preview'
          git push origin HEAD:main
