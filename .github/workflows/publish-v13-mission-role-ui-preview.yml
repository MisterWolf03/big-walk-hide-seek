name: Publish v1.3 mission role UI preview
on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/publish-v13-mission-role-ui-preview.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0
      - name: Publish validated source to preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE_SHA=$(git rev-parse HEAD)
          git checkout main
          git pull --ff-only origin main
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"')!=1: raise SystemExit('unexpected map path count')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1)
          start=s.index('<script>')+len('<script>');end=s.index('</script>',start)
          Path('/tmp/preview.js').write_text(s[start:end],encoding='utf-8')
          assert 'v13-mission-role-ui-20260829a' in s
          assert 'id="missionSettingsGroup"' in s
          assert 'id="roomRoleSwitchSelect"' in s
          PY
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Publish mission role UI v1.3 preview"
          git push origin main
