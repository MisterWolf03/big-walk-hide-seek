name: Publish private relocation preview
on:
  push:
    branches: [v1.3.0-hider]
    paths: ['.github/workflows/publish-private-relocation-preview.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0
      - name: Remember source
        run: echo "SOURCE_SHA=$(git rev-parse HEAD~0)" >> "$GITHUB_ENV"
      - name: Publish preview files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout main
          git pull --ff-only origin main
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 -c "from pathlib import Path; p=Path('v1.3-preview/index.html'); s=p.read_text(); assert s.count('src=\"big-walk-map.png\"')==1; p.write_text(s.replace('src=\"big-walk-map.png\"','src=\"../big-walk-map.png\"',1))"
          git diff --check
          git add v1.3-preview
          git commit -m 'Publish private relocation range preview'
          git push origin main
