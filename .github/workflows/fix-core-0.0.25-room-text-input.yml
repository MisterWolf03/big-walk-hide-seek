name: Fix Core 0.0.25 Room Text Input

on:
  push:
    branches:
      - mod-prototype
    paths:
      - "dev-tools/fix_core_0_0_25_room_text_input.py"
      - ".github/workflows/fix-core-0.0.25-room-text-input.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: mod-prototype

      - name: Apply room text input fix
        run: python dev-tools/fix_core_0_0_25_room_text_input.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add in-game-mod/core/CoreEntry.cs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Core 0.0.25 room text input"
            git push
          fi
