name: v1.3 Hider overtime pass

on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/v1.3-hider-overtime-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch v1.3 overtime reveal
        run: python3 .github/scripts/v13_patch.py

      - name: Validate v1.3 branch
        run: |
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); a=s.index('<script>')+len('<script>'); b=s.index('</script>',a); Path('/tmp/app.js').write_text(s[a:b]); assert 'const OVERTIME_REVEAL_RADIUS=200;' in s; assert 'const OVERTIME_REVEAL_MS=120000;' in s; assert 'rgba(225,43,43,.50)' in s; assert 'HIDER_MISSION_TARGET_FILL=\"rgba(147,86,255,.38)\"' in s; assert 'signalRelocationOvertime' in s; assert 'src=\"big-walk-map.png\"' in s"
          python3 -c "from pathlib import Path; r=Path('rooms.js').read_text(); assert 'getHiderOvertimeSignal' in r; assert 'signalRelocationOvertime' in r; assert 'getServerNow:()=>serverNow()' in r"
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check

      - name: Commit v1.3 branch
        run: |
          rm .github/workflows/v1.3-hider-overtime-pass.yml
          rm .github/scripts/v13_patch.py
          git add -A
          git commit -m "Add v1.3 relocation overtime reveal"
          git push origin v1.3.0-hider
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish isolated v1.3 preview
        run: |
          git checkout main
          git pull --ff-only origin main
          mkdir -p v1.3-preview
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 -c "from pathlib import Path; p=Path('v1.3-preview/index.html'); s=p.read_text(); assert s.count('src=\"big-walk-map.png\"')==1; p.write_text(s.replace('src=\"big-walk-map.png\"','src=\"../big-walk-map.png\"',1))"
          printf '%s\n' 'Big Walk Hide + Seek v1.3 development preview. Stable v1.2 remains at the site root.' > v1.3-preview/README.txt
          python3 -c "from pathlib import Path; s=Path('v1.3-preview/index.html').read_text(); a=s.index('<script>')+len('<script>'); b=s.index('</script>',a); Path('/tmp/preview.js').write_text(s[a:b]); assert 'src=\"../big-walk-map.png\"' in s; assert '1.3.0-preview' in s"
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Publish v1.3 Hider overtime preview"
          git push origin main
