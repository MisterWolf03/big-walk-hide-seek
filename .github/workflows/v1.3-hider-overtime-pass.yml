name: v1.3 Hider overtime pass

on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/v1.3-hider-overtime-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch v1.3 overtime reveal
        run: |
          echo ' IxLjIuMCI7JywgJ2NvbnN0IEFQUF9WRVJTSU9OPS   nJw==
' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Validate v1.3 branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          checks=[
            'const OVERTIME_REVEAL_RADIUS=200;',
            'const OVERTIME_REVEAL_MS=120000;',
            'rgba(225,43,43,.50)',
            'HIDER_MISSION_TARGET_FILL="rgba(147,86,255,.38)"',
            'signalRelocationOvertime',
            'relocationOvertime',
            'src="big-walk-map.png"',
          ]
          for check in checks:
              assert check in s,check
          r=Path('rooms.js').read_text(encoding='utf-8')
          assert 'getHiderOvertimeSignal' in r
          assert 'signalRelocationOvertime' in r
          assert 'getServerNow:()=>serverNow()' in r
          PY
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check

      - name: Commit v1.3 branch
        run: |
          rm .github/workflows/v1.3-hider-overtime-pass.yml
          git add index.html rooms.js version.json .github/workflows/v1.3-hider-overtime-pass.yml
          git commit -m "Add v1.3 relocation overtime reveal"
          git push origin v1.3.0-hider
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish isolated v1.3 preview
        run: |
          git checkout main
          git pull --ff-only origin main
          mkdir -p v1.3-preview
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"')!=1:
              raise SystemExit('unexpected preview map source count')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1)
          p.write_text(s,encoding='utf-8')
          Path('v1.3-preview/README.txt').write_text('Big Walk Hide + Seek v1.3 development preview. Stable v1.2 remains at the site root.\n',encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('v1.3-preview/index.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/preview.js').write_text(s[start:end],encoding='utf-8')
          assert 'src="../big-walk-map.png"' in s
          assert '1.3.0-preview' in s
          PY
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Publish v1.3 Hider overtime preview"
          git push origin main
