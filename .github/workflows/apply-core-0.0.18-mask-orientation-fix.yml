name: Apply Core 0.0.24 Minimap + Audio

on:
  push:
    branches: [mod-prototype]
    paths:
      - '.github/workflows/apply-core-0.0.18-mask-orientation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod-prototype
          fetch-depth: 0

      - name: Correct patch source and apply fixes
        run: |
          sed -i 's/740f/760f/g' dev-tools/apply_core_0_0_24_minimap_overlays_audio.py
          python dev-tools/apply_core_0_0_24_minimap_overlays_audio.py

      - name: Commit Core 0.0.24 fixes
        run: |
          if git diff --quiet; then
            echo 'No changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev-tools/apply_core_0_0_24_minimap_overlays_audio.py in-game-mod/core/CoreEntry.cs in-game-mod/core/BigWalkHideSeek.Core.csproj
          git commit -m 'Improve minimap overlays and notification audio'
          git push origin HEAD:mod-prototype
