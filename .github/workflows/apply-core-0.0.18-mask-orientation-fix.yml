name: Apply Core 0.0.22 Map Stabilization

on:
  push:
    branches: [mod-prototype]
    paths:
      - '.github/workflows/apply-core-0.0.18-mask-orientation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod-prototype
          fetch-depth: 0

      - name: Stabilize runtime map texture
        run: python dev-tools/apply_core_0_0_22_stabilize_map_texture.py

      - name: Commit map stabilization fix
        run: |
          if git diff --quiet; then
            echo 'No changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add in-game-mod/core/CoreEntry.cs in-game-mod/core/BigWalkHideSeek.Core.csproj
          git commit -m 'Stabilize map texture after world spawn'
          git push origin HEAD:mod-prototype
