name: Fix role switch reconnect
on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/fix-role-switch-reconnect.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python3 .github/scripts/fix-role-switch-reconnect.py
      - run: node --check rooms.js
      - run: |
          git add rooms.js
          git commit -m "Preserve switched host role on reconnect"
          git push origin v1.3.0-hider
