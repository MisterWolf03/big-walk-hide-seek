name: Run v1.3 UI pass 2 edge fixes

on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/run-v13-ui-pass2-edgecases.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply edge fixes
        run: python3 .github/scripts/fix-v13-ui-pass2-edgecases.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '#leaveRoomBtn{background:#3b2226' in s
          assert 'maybeHostAdvanceMission(){\n  if(!roomModeConnected()||!roomCanDriveMission()||missionMutationBusy||!roomMatchRunning()||hidingTimeRemaining()>.01)return;' in s
          assert 'maybeHostAdvanceRelocation(){\n  if(!roomModeConnected()||!roomCanDriveRelocation()||relocationMutationBusy||!roomMatchRunning()||hidingTimeRemaining()>.01)return;' in s
          start=s.index('<script>')+len('<script>'); end=s.index('</script>',start)
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check
      - name: Commit source
        run: |
          git add index.html
          git commit -m "Polish v1.3 hiding phase UI"
          git push origin v1.3.0-hider
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish preview
        run: |
          git checkout main
          git pull --ff-only origin main
          git show "$SOURCE_SHA:index.html" > v1.3-preview/index.html
          git show "$SOURCE_SHA:rooms.js" > v1.3-preview/rooms.js
          git show "$SOURCE_SHA:firebase-config.js" > v1.3-preview/firebase-config.js
          git show "$SOURCE_SHA:version.json" > v1.3-preview/version.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1.3-preview/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('src="big-walk-map.png"')!=1: raise SystemExit('unexpected map path count')
          s=s.replace('src="big-walk-map.png"','src="../big-walk-map.png"',1)
          p.write_text(s,encoding='utf-8')
          start=s.index('<script>')+len('<script>'); end=s.index('</script>',start)
          Path('/tmp/preview.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/preview.js
          node --check v1.3-preview/rooms.js
          git diff --check
          git add v1.3-preview
          git commit -m "Publish v1.3 hiding phase UI polish"
          git push origin main
