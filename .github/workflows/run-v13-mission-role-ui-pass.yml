name: v1.3 mission role UI pass
on:
  push:
    branches: [v1.3.0-hider]
    paths:
      - '.github/workflows/run-v13-mission-role-ui-pass.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-hider
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply patch
        run: python3 .github/scripts/apply-v13-mission-role-ui-pass.py
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'const REQUIRED_ROOMS_BUILD_ID="v13-mission-role-ui-20260829a";' in s
          assert 'id="missionSettingsGroup"' in s
          assert 'id="roomRoleSwitchSelect"' in s
          assert 'Horizontal centerline — Y 37' in s
          assert 'Vertical centerline — X 17' in s
          assert 'topSub.textContent="Relocate"' in s
          assert 'topSub.textContent="Mission Active"' in s
          assert 'else topSub.textContent="Hiding"' in s
          assert 'M4 3v7l3 3v8h10v-8l3-3V3h-3v4h-3V3h-4v4H7V3H4Z' in s
          assert s.rfind('Development / testing') > s.find('Hider missions')
          start=s.index('<script>')+len('<script>');end=s.index('</script>',start)
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check rooms.js
          git diff --check
      - name: Commit app changes
        run: |
          git add index.html rooms.js
          git commit -m "Add mission settings and in-room role switching"
          git push origin v1.3.0-hider
